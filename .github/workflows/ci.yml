name: CI

on:
  push:
    branches: [ "main", "fix/critical-bugs" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 📦 Download embedded binaries (setup.sh)
        run: |
          chmod +x ./setup.sh
          ./setup.sh
        shell: bash

      - name: 🔍 Go Vet (Static Analysis)
        run: go vet ./...

      - name: 🔨 Build
        run: go build -v -o near-go .

      - name: 🧪 Run Unit Tests
        run: go test -v ./...
        continue-on-error: true

      - name: ✅ Build Success
        run: echo "🎉 Build and static analysis passed successfully!"
